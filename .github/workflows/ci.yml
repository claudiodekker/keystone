name: CI

on:
    push:
        branches: [master]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: PHP ${{ matrix.php }} ${{ matrix.stability }} (${{ matrix.database }})
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php: ['8.4', '8.5']
                stability: [prefer-lowest, prefer-stable]
                database: [sqlite]
                include:
                    - php: '8.4'
                      stability: prefer-stable
                      database: pgsql
                    - php: '8.4'
                      stability: prefer-stable
                      database: mysql

        services:
            postgres:
                image: postgres:17
                env:
                    POSTGRES_DB: keystone
                    POSTGRES_PASSWORD: password
                ports: ['5432:5432']
                options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_DATABASE: keystone
                    MYSQL_ROOT_PASSWORD: password
                ports: ['3306:3306']
                options: --health-cmd "mysqladmin ping" --health-interval 10s --health-timeout 5s --health-retries 5

        env:
            DB_CONNECTION: ${{ matrix.database }}
            DB_HOST: 127.0.0.1
            DB_PORT: ${{ matrix.database == 'mysql' && '3306' || '5432' }}
            DB_DATABASE: ${{ matrix.database == 'sqlite' && ':memory:' || 'keystone' }}
            DB_USERNAME: ${{ matrix.database == 'mysql' && 'root' || 'postgres' }}
            DB_PASSWORD: password

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: pdo_sqlite, pdo_pgsql, pdo_mysql
                  coverage: none

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22
                  cache: npm

            - run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

            - run: npm ci

            - run: composer check

    audit:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: '8.4'
                  coverage: none

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22

            - run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

            - run: composer audit

            - run: npm audit
