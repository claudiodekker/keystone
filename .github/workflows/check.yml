name: check

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sqlite:
    name: PHP ${{ matrix.php }}, ${{ matrix.dependencies }} dependencies, SQLite
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        dependencies: [lowest, stable]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, pdo_sqlite
          coverage: none

      - run: composer update --prefer-stable --no-interaction --no-progress ${{ matrix.dependencies == 'lowest' && '--prefer-lowest' || '' }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: composer check

  pgsql:
    name: PHP 8.5, stable dependencies, Postgres
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: keystone
          POSTGRES_PASSWORD: password
          POSTGRES_USER: keystone
        ports:
          - 5432:5432
        options: --health-cmd=pg_isready --health-interval=5s --health-timeout=5s --health-retries=10

    env:
      DB_CONNECTION: pgsql
      DB_DATABASE: keystone
      DB_HOST: 127.0.0.1
      DB_PASSWORD: password
      DB_PORT: 5432
      DB_USERNAME: keystone

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: intl, pdo_pgsql
          coverage: none

      - run: composer update --prefer-stable --no-interaction --no-progress

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: composer check

  mysql:
    name: PHP 8.5, stable dependencies, MySQL
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: keystone
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=5s --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_DATABASE: keystone
      DB_HOST: 127.0.0.1
      DB_PASSWORD: ''
      DB_PORT: 3306
      DB_USERNAME: root

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: intl, pdo_mysql
          coverage: none

      - run: composer update --prefer-stable --no-interaction --no-progress

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: composer check

  core-alone:
    name: PHP 8.5, core without the other packages, SQLite
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: intl, pdo_sqlite
          coverage: none

      - run: composer update --prefer-stable --no-interaction --no-progress

      - run: composer remove --dev --no-interaction --no-progress claudiodekker/keystone-inertia-vue claudiodekker/keystone-password

      - run: vendor/bin/pest --testsuite=app-tests,contract,keystone

  keystone-inertia-vue:
    name: PHP 8.5, keystone-inertia-vue without the method packages, SQLite
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: intl, pdo_sqlite
          coverage: none

      - run: composer update --prefer-stable --no-interaction --no-progress

      - run: composer remove --dev --no-interaction --no-progress claudiodekker/keystone-password

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: vendor/bin/pest --testsuite=keystone-inertia-vue

  keystone-password:
    name: PHP 8.5, keystone-password, SQLite
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: intl, pdo_sqlite
          coverage: none

      - run: composer update --prefer-stable --no-interaction --no-progress

      - run: vendor/bin/pest --testsuite=contract,keystone-password

  inertia-vue-app:
    name: PHP 8.5, keystone-inertia-vue in a fresh Laravel app, ${{ matrix.methods }}, SQLite
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - methods: every method, AppTests
            without: ''
          - methods: without keystone-password, build and sign-in page
            without: claudiodekker/keystone-password

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: keystone
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: intl, pdo_sqlite
          coverage: none

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - run: composer create-project laravel/laravel:^13.0 app --prefer-dist --no-interaction --no-progress

      - name: Install Pest
        working-directory: app
        run: |
          composer require pestphp/pest --dev --with-all-dependencies --no-interaction --no-progress
          vendor/bin/pest --init

      - name: Require Keystone, the adapter and the methods from the checkout
        working-directory: app
        env:
          WITHOUT: ${{ matrix.without }}
        run: |
          packages=$(jq -r '.name' ../keystone/packages/*/composer.json | grep -vxF "$WITHOUT")
          versions=$(jq -c -n '$ARGS.positional | map({(.): "dev-checkout"}) | add' --args $packages)
          composer config repositories.keystone "{\"type\": \"path\", \"url\": \"../keystone/packages/*\", \"options\": {\"versions\": $versions}}"
          composer require $(printf '%s:@dev ' $packages) --no-interaction --no-progress

      - working-directory: app
        run: php artisan keystone:install --no-interaction

      - working-directory: app
        run: php artisan migrate --no-interaction

      - if: matrix.without == ''
        working-directory: app
        run: php artisan test --testsuite=Keystone

      - if: matrix.without != ''
        name: Type-check the pages and serve the sign-in page
        working-directory: app
        run: |
          npx vue-tsc --noEmit
          php artisan serve --no-reload > storage/logs/serve.log 2>&1 &
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 --output /dev/null http://127.0.0.1:8000/login
